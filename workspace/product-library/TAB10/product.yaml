facts:
  - 平板正面为黑色边框，横向长边中央有一枚前置摄像头
  - 平板背壳为深灰色，后置单摄与独立闪光灯位于背面一角
  - 平板背面可见 TAB10 型号标识；生成商品身份时保留该型号，不替换为其他 SKU
  - 套装素材中可见黑色键盘、黑色鼠标、银灰色触控笔、黑色保护壳和黑色充电线
  - 平板主体外观只由本目录 images/tablet 中的 TAB10 专属图片定义
allowed_claims:
  - TAB10套装包含平板、键盘、鼠标、触控笔、保护壳和充电线，以当前实拍图所示组合为准
  - 可展示平板与套装键盘、鼠标、触控笔和保护壳组合使用的场景
forbidden_claims:
  - 未经确认的处理器、内存、存储、屏幕尺寸、分辨率和续航声称
  - 未经确认的操作系统、软件或外设兼容性声称
  - 未经确认的防水、防摔、游戏性能和专业生产力声称
  - 未经确认的价格、折扣、库存、赠品活动和到期时间
  - 将机身或包装上的参数文字、颜色选项或图示扩写成营销声称
